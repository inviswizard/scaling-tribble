name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Brilliant-eLibrary-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 app/build/outputs/apk/debug/*.apk --target "${GITHUB_SHA}" --title "Brilliant eLibrary v1.0.0" --notes "Debug-signed test APK."
